# /etc/nginx/sites-available/xiaomi-collab.opencrabs.com
# Fronts xiaomiproxy (127.0.0.1:8787). This is the host OpenCrabs points
# [providers.xiaomi] base_url at: https://xiaomi-collab.opencrabs.com/v1/chat/completions

server {
    listen 80;
    server_name xiaomi-collab.opencrabs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xiaomi-collab.opencrabs.com;

    # Issue with: certbot --nginx -d xiaomi-collab.opencrabs.com
    ssl_certificate     /etc/letsencrypt/live/xiaomi-collab.opencrabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaomi-collab.opencrabs.com/privkey.pem;

    # Generous body for long prompts.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The proxy reads X-Forwarded-For for per-IP rate limiting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming (SSE) must pass through unbuffered, and chat completions can
        # be long-lived — bump the timeouts.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }
}
